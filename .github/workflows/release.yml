name: Release

# Tagging is the release trigger, so the version in the exe and the version in
# the tag cannot drift apart — the tag is where it comes from.
#
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write        # needed to create the release and upload assets

jobs:
  # Deliberately a separate, blocking job: a release that fails its own tests
  # is worse than no release, because the updater hands it to everyone.
  gate:
    name: Tests must pass first
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The dev set, so the route tests run here too rather than skipping
      # themselves — the gate is the last place that would notice.
      - run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: |
          status=0
          for f in tests/test_*.py; do python "$f" || status=1; done
          exit $status

  build:
    name: Build and publish
    needs: gate
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Derive version from the tag
        id: version
        shell: bash
        run: |
          raw="${{ github.event.inputs.tag || github.ref_name }}"
          version="${raw#v}"
          # The assembly version has to be strictly numeric, so a
          # "-rc1" suffix is kept for the release name but stripped here.
          numeric="${version%%-*}"
          if ! echo "$numeric" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$raw' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "numeric=$numeric" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Publish single-file client
        shell: bash
        run: |
          dotnet publish ui/FortsLadder.csproj \
            -c Release -o publish --nologo \
            -p:Version=${{ steps.version.outputs.numeric }} \
            -p:InformationalVersion=${{ steps.version.outputs.version }}

      - name: Name the asset after its version
        id: asset
        shell: bash
        run: |
          name="FortsLadder-${{ steps.version.outputs.version }}-win-x64.exe"
          mv publish/FortsLadder.exe "publish/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The updater refuses to install anything it cannot verify, so this file
      # is not optional decoration — without it there is no upgrade path.
      - name: Checksums
        shell: bash
        working-directory: publish
        run: |
          sha256sum "${{ steps.asset.outputs.name }}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            publish/${{ steps.asset.outputs.name }}
            publish/SHA256SUMS.txt
          body: |
            Windows client, one file, nothing to install first.

            **Verify the download before running it** — the updater does this
            automatically, a manual download does not:

            ```powershell
            Get-FileHash .\${{ steps.asset.outputs.name }} -Algorithm SHA256
            ```

            Compare against `SHA256SUMS.txt` below.

            The client checks for updates on start and asks before installing
            one. It will not install a build whose checksum does not match.
