# nginx vhost for the ladder API.
#
#   install: /etc/nginx/sites-available/ladder.example.com
#            ln -s ../sites-available/ladder.example.com /etc/nginx/sites-enabled/
#
# TLS listens on 127.0.0.1:4433 rather than 443 because the host this was
# written for runs sslh on 443, demultiplexing SSH from TLS — so the public
# port belongs to sslh and nginx sits behind it. On a plain host, change these
# two listen lines to `listen 443 ssl;` and `listen [::]:443 ssl;`.
#
# Adjust the certificate paths to match the host; they are whatever the other
# vhosts already use.

server {
    listen 80;
    listen [::]:80;
    server_name ladder.example.com;

    # The client and the API talk over HTTPS only; the join links and session
    # cookies have no business on plaintext.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # No http2 directive: this host runs nginx 1.24, where `http2 on;` does not
    # exist yet, and none of the sibling vhosts enable it either. HTTP/1.1 is
    # fine for a JSON API of this size.
    listen 127.0.0.1:4433 ssl;
    server_name ladder.example.com;

    # Existing certificate on the host, shared with the sibling vhosts. A
    # wildcard covers a new subdomain with no extra issuance step.
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Generous enough for a match report, small enough that the endpoint is
    # not a convenient upload target.
    client_max_body_size 256k;

    access_log /var/log/nginx/ladder.access.log;
    error_log  /var/log/nginx/ladder.error.log;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;

        # sslh forwards the real client address; without these the API would
        # see every request as coming from 127.0.0.1.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
